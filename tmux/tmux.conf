# ── True color (24-bit RGB) ─────────────────────────────────────
# Without RGB advertised here, tmux clamps to 256 colors and themes look muddy.
# `tmux-256color` is the recommended terminfo for the *inside* of tmux;
# `terminal-features` tells tmux which capabilities the *outer* terminal has.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-ghostty:RGB"

# ── Extended keys (Shift+Enter, Ctrl+Enter, etc.) ───────────────
# Ghostty sends CSI-u sequences for these. Without `extended-keys on`,
# tmux folds them into plain Enter. `extkeys` advertises support to the
# outer terminal so it actually emits the sequences in the first place.
set -s extended-keys on
set -as terminal-features ",xterm*:extkeys"

# ── Mouse ───────────────────────────────────────────────────────
set -g mouse on

# ── Sensible defaults (inlined from tmux-sensible) ──────────────
# Tiny escape-time so Esc in helix/vim is responsive
set -sg escape-time 10
set -g history-limit 50000
setw -g aggressive-resize on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded"

# ── Splits inherit the current path ─────────────────────────────
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

# ── Command palette (prefix + Space) ────────────────────────────
bind Space display-popup -E -w 60% -h 50% "~/.config/tmux/palette.fish"

# ── Plugins (TPM) ───────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dracula/tmux'

# Dracula
set -g @dracula-plugins "battery time"
set -g @dracula-show-left-icon session
set -g @dracula-show-flags true
set -g @dracula-show-powerline true
set -g @dracula-day-month true
set -g @dracula-military-time true
set -g @dracula-refresh-rate 5

# Init TPM — must be the last line
run '~/.config/tmux/plugins/tpm/tpm'
